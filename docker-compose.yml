services:
  db:
    image: postgres:16-alpine
    container_name: fittrack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400030522"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: busharjahashaik/docker-backend-2400030522:latest
    container_name: fittrack-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/exam_2400030522
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: busharjahashaik/docker-frontend-2400030522:latest
    container_name: fittrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: